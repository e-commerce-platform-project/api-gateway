server:
  port: 8765
  ssl:
    enabled: ${SERVER_SSL_ENABLED}
    key-store: ${SERVER_SSL_KEY-STORE}
    key-store-password: ${SERVER_SSL_KEY-STORE-PASSWORD}
    key-store-type: ${SERVER_SSL_KEY-STORE-TYPE}
    key-alias: ${SERVER_SSL_KEY-ALIAS}

spring:
  application:
    name: API-GATEWAY


#  security:
#    oauth2:
#      resourceserver:
#        jwt:
#          issuer-uri: http://keycloak:8080/auth/realms/ecommerce-platform-project

  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origin-patterns:
                  - "*"
                allowed-methods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                  - PATCH
                allowed-headers:
                  - "*"
          discovery:
            locator:
              enabled: true
          routes:
            - id: product-service-route
              uri: lb://product-service
              predicates:
                - Path=/products/**
              filters:
                - PrefixPath=/api/v1


            - id: cart-service-route
              uri: lb://cart-service
              predicates:
                - Path=/carts/**
              filters:
                - PrefixPath=/api/v1


            - id: auth-service-route
              uri: lb://auth-service
              predicates:
                - Path=/auth/**
              filters:
                - PrefixPath=/api/v1


            - id: user-service-protected
              uri: lb://user-service
              predicates:
                - Path=/users/**
              filters:
                - PrefixPath=/api/v1


            - id: seller-service-route
              uri: lb://seller-service
              predicates:
                - Path=/sellers/**
              filters:
                - PrefixPath=/api/v1

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: ${EUREKA_URL}