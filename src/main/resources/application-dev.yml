spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origin-patterns:
                  -  "*"
                allowed-methods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                  - PATCH
                allowed-headers: "*"
                max-age: 3600
          discovery:
            locator:
              enabled: true
          routes:
            - id: product-service-route
              uri: lb://product-service
              predicates:
                - Path=/products/**
              filters:
                - PrefixPath=/api/v1
            - id: cart-service-route
              uri: lb://cart-service
              predicates:
                - Path=/carts/**
              filters:
                - PrefixPath=/api/v1
            - id: auth-service-route
              uri: lb://auth-service
              predicates:
                - Path=/auth/**
              filters:
                - PrefixPath=/api/v1

            - id: user-service-route
              uri: lb://user-service
              predicates:
                - Path=/users/**
              filters:
                - PrefixPath=/api/v1

            - id: seller-service-route
              uri: lb://seller-service
              predicates:
                - Path=/sellers/**
              filters:
                - PrefixPath=/api/v1

server:
  port: 8765
  forward-headers-strategy: framework

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:${EUREKA_PORT:8761}/eureka/